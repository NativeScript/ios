version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /
      - /AppWithModules/app
      - /TestRunner/app
      - /TestRunner/app/tests
      - /TestRunner/app/tests/shared
      - /TestRunner/app/tests/shared/Require/PackageJsonApp/io
      - /TestRunner/app/tests/shared/Require/PackageJsonAppNoMain/io
      - /TestRunner/app/tests/shared/Require/PackageJsonAppWithoutExtension/io
      - /TestRunner/app/tests/shared/Require/PackageJsonMainPointsToDir
      - /TestRunner/app/tests/shared/Require/PackageJsonSyntaxError/io
      - /TestRunner/app/tests/shared/Require/ResolveCanonicalPath
      - /TestRunner/app/tns_modules/dummy-package
      - /TestRunner/app/tns_modules/tns-core-modules/shared/Require/PackageJsonTns/io
      - /TestRunner/app/tns_modules/tns-core-modules/shared/Require/RequirePriority/dependency5
    schedule:
      interval: monthly
      time: "23:00"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
